version: 2
updates:
  # Root devDeps — pm2, vitest, eslint, etc. These don't ship and
  # don't gate CI (see audit job in ci.yml), but we still want a
  # weekly nudge so they don't drift years out.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - root

  # Server prod deps — gated by the audit job, so any advisory here
  # blocks CI. Weekly cadence keeps us ahead of advisories.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - server

  # Client prod deps — same gating story as server.
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - client

  # GitHub Actions versions in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
