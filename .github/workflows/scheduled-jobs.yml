name: scheduled-jobs

# Backups, restore-verification drills, and the maintenance jobs
# (import-snapshot cleanup, LDF benchmark refresh, facultative accumulation
# refresh) wired as code. Each job alerts
# on failure via scripts/run-with-alert.sh (ALERT_WEBHOOK_URL secret).
#
# Scheduled workflows run on the DEFAULT branch only; until merged, use the
# "Run workflow" button (workflow_dispatch) to exercise any job. The
# restore-verification drill is SELF-CONTAINED (its own throwaway Postgres) and
# also runs on push so script regressions are caught in CI.
#
# Committed targets: RPO <= 24h (nightly dump), RTO <= 4h — see
# docs/backup-recovery.md. Durable backups push to object storage when the
# BACKUP_S3_* / AWS_* secrets are configured.

on:
  schedule:
    - cron: '0 2 * * *'    # db-backup            — nightly 02:00 UTC  (meets RPO <= 24h)
    - cron: '30 3 * * 0'   # restore-verification — weekly  Sun 03:30 UTC
    - cron: '0 4 * * *'    # snapshot-cleanup     — daily   04:00 UTC
    - cron: '0 5 * * 1'    # ldf-refresh          — weekly  Mon 05:00 UTC (cadence placeholder)
    # Nightly, not weekly: every facultative quote's capacity check reads
    # mv_fac_accumulation, and a stale view means measuring today's risk
    # against last week's book. The view also refreshes on every bind; this is
    # the safety net for what a bind cannot see — a treaty's CRESTA aggregates
    # changing, a bound risk being corrected, a server restart mid-bind.
    - cron: '30 1 * * *'   # fac-accumulation     — nightly 01:30 UTC (before the 02:00 backup)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run on demand'
        type: choice
        default: restore-verification
        options: [restore-verification, db-backup, snapshot-cleanup, ldf-refresh, fac-accumulation]
  push:
    paths:
      - 'scripts/backup-db.sh'
      - 'scripts/verify-restore.sh'
      - 'scripts/run-with-alert.sh'
      - '.github/workflows/scheduled-jobs.yml'

concurrency:
  group: scheduled-jobs-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: these jobs read the repo, run scripts, and upload a run
# artifact — none write back to the repo or need elevated token scope.
permissions:
  contents: read

jobs:
  # ── Restore-verification drill (self-contained: proves the backup+restore
  #    tooling end-to-end against a throwaway Postgres, no prod access). ──
  restore-verification:
    name: restore-verification drill
    if: >-
      github.event_name == 'push'
      || github.event.schedule == '30 3 * * 0'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'restore-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reinsurance_tool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reinsurance_tool
      NODE_ENV: test
      BACKUP_DIR: ${{ github.workspace }}/backup-out
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SOURCE: github-actions/restore-verification
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Install postgresql-client (pg_dump/pg_restore/psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install server deps
        run: npm ci --include=optional --prefix server
      - name: Migrate the throwaway DB (seeds the schema + reference data)
        run: npm run migrate --prefix server
      - name: Backup the throwaway DB
        run: scripts/run-with-alert.sh db-backup-drill -- scripts/backup-db.sh
      - name: Verify the backup restores cleanly (drill)
        run: scripts/run-with-alert.sh restore-verification -- scripts/verify-restore.sh

  # ── Production backup (independent of restore-verify). Skips safely when the
  #    PROD secret is not configured, so the workflow never fails for that. ──
  db-backup:
    name: db-backup (prod)
    if: >-
      github.event.schedule == '0 2 * * *'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'db-backup')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_DIR: ${{ github.workspace }}/backup-out
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
      # Durable object storage (push the dump off the runner). When BACKUP_S3_BUCKET
      # is unset, backup-db.sh skips the upload and only the run artifact below is kept.
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'backups' }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SOURCE: github-actions/db-backup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Skip if no prod DB configured
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "PROD_DATABASE_URL not set — skipping prod backup (configure the secret to enable)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install postgresql-client
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Backup prod (uploads to object storage when BACKUP_S3_BUCKET is set)
        if: steps.guard.outputs.skip != 'true'
        run: scripts/run-with-alert.sh db-backup -- scripts/backup-db.sh
      # Portable fallback copy. Durable retention is the object-storage bucket
      # lifecycle (see docs/backup-recovery.md); this 7-day artifact is a safety net.
      - name: Upload dump artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ github.workspace }}/backup-out/*.dump
          retention-days: 7

  snapshot-cleanup:
    name: import-snapshot cleanup (prod)
    if: >-
      github.event.schedule == '0 4 * * *'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SOURCE: github-actions/snapshot-cleanup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Run snapshot cleanup (skips if no prod DB)
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "PROD_DATABASE_URL not set — skipping."; exit 0; fi
          npm ci --include=optional --prefix server
          scripts/run-with-alert.sh snapshot-cleanup -- npm run cleanup:snapshots --prefix server

  ldf-refresh:
    name: LDF benchmark refresh (prod)
    if: >-
      github.event.schedule == '0 5 * * 1'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'ldf-refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SOURCE: github-actions/ldf-refresh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Run LDF benchmark refresh (skips if no prod DB)
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "PROD_DATABASE_URL not set — skipping."; exit 0; fi
          npm ci --include=optional --prefix server
          scripts/run-with-alert.sh ldf-refresh -- npm run refresh:ldf-benchmarks --prefix server

  fac-accumulation:
    name: fac accumulation refresh (prod)
    if: >-
      github.event.schedule == '30 1 * * *'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fac-accumulation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SOURCE: github-actions/fac-accumulation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Refresh committed fac exposure (skips if no prod DB)
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "PROD_DATABASE_URL not set — skipping."; exit 0; fi
          npm ci --include=optional --prefix server
          scripts/run-with-alert.sh fac-accumulation -- npm run refresh:fac-accumulation --prefix server
