name: image-security

# Builds the production container image, generates a Software Bill of Materials
# (SBOM), and scans the image for known vulnerabilities. Complements the
# source-level `npm audit` gate in ci.yml by covering the OS/base-image layers.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.jobs'
      - '.dockerignore'
      - 'package*.json'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/image-security.yml'

concurrency:
  group: image-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-sbom:
    name: build + SBOM (Syft) + scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning
    env:
      IMAGE: universe3:ci-${{ github.sha }}
      JOBS_IMAGE: universe3-jobs:ci-${{ github.sha }}
      # Official Trivy image, pinned by digest (v0.74.0). Replaces
      # aquasecurity/trivy-action, which internally references
      # aquasecurity/setup-trivy@v0.2.1 — a tag that no longer resolves
      # upstream, so every run of this job failed ~20s in with
      # "Unable to resolve action ... unable to find version v0.2.1".
      # Running the release image directly removes that indirection and
      # pins the scanner itself rather than a wrapper around it.
      TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image (load into local docker)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SBOM (always produced, even if the scan later fails the job) ──
      - name: Generate SBOM (Syft, SPDX-JSON)
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      # ── Vulnerability scan ──
      # Report HIGH+CRITICAL to code scanning (non-blocking visibility) …
      - name: Trivy scan → SARIF (report)
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image \
              --format sarif --output trivy-results.sarif \
              --severity HIGH,CRITICAL --ignore-unfixed \
              "$IMAGE"

      - name: Upload Trivy SARIF to code scanning
        if: always()
        continue-on-error: true # don't fail the job if code scanning is off
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-results.sarif

      # … and HARD-FAIL only on a fixable CRITICAL, so the gate is meaningful
      # without being noisy on day one. Tighten to HIGH,CRITICAL once the base
      # image is on a regular bump cadence.
      - name: Trivy scan → gate (fail on fixable CRITICAL)
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image \
              --format table --severity CRITICAL --ignore-unfixed \
              --exit-code 1 \
              "$IMAGE"

      # ── Cron/backup jobs image (Dockerfile.jobs). Previously unscanned — its
      #    debian base + postgresql-client/awscli layers carry their own CVE
      #    surface. Build and gate it on the same fixable-CRITICAL bar. ──
      - name: Build jobs image (Dockerfile.jobs)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.jobs
          load: true
          tags: ${{ env.JOBS_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan jobs image → gate (fail on fixable CRITICAL)
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image \
              --format table --severity CRITICAL --ignore-unfixed \
              --exit-code 1 \
              "$JOBS_IMAGE"
