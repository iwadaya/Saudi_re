name: codeql

# Static application security testing (SAST) for first-party JavaScript/TypeScript.
# Complements the dependency/image scanners (npm audit in ci.yml, Trivy in
# image-security.yml) by analysing OUR OWN code for injection, unsafe data flow,
# prototype pollution, etc. Results land in the repo's Code scanning tab.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1' # weekly Mon 06:00 UTC — catch newly-published query updates

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Code scanning needs Code Security (GitHub Advanced Security) switched on
      # for the repository. It currently is not, so every run of this workflow
      # failed inside `init` with "Code Security must be enabled for this
      # repository to use code scanning" — a permanently red check that no
      # commit can fix, which trains people to ignore red.
      #
      # Probe for the feature instead of assuming it. When it is on, the
      # analysis runs and uploads exactly as before. When it is off, the job
      # skips and says so loudly in the run summary rather than failing. Flip
      # the repository setting and this starts working with no workflow change.
      - name: Check whether code scanning is available
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/cs.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" || echo 000)
          # 403 + an "…Security must be enabled…" body is the disabled signal.
          # A 404 here just means "no analyses uploaded yet", which is fine.
          if [ "$code" = "403" ] && grep -qiE '(advanced|code) security must be enabled' /tmp/cs.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          echo "code-scanning probe: HTTP $code"

      - name: Report that SAST is not running
        if: steps.availability.outputs.enabled != 'true'
        run: |
          {
            echo "### CodeQL skipped — SAST is not running"
            echo
            echo "Code scanning is not enabled for this repository, so CodeQL cannot"
            echo "upload results and the analysis is skipped."
            echo
            echo "**This is a real gap in coverage, not a passing check.** First-party"
            echo "code is currently unscanned for injection, unsafe data flow and"
            echo "prototype pollution. An administrator can close it under"
            echo "Settings → Code security, after which this workflow runs unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=SAST disabled::CodeQL skipped — enable Code Security to scan first-party code."

      - name: Initialize CodeQL
        if: steps.availability.outputs.enabled == 'true'
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability queries on top of the
          # default security set; drop to `security-extended` if it gets noisy.
          queries: security-and-quality

      # No compiled build step — JS/TS is analysed as-is. Autobuild is a no-op
      # here but kept for forward-compat if a build-required language is added.
      - name: Autobuild
        if: steps.availability.outputs.enabled == 'true'
        uses: github/codeql-action/autobuild@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5

      - name: Perform CodeQL analysis
        if: steps.availability.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: /language:javascript-typescript
