name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'

jobs:
  audit:
    name: prod dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each workspace ships its own lockfile and prod-vs-dev split, so
      # audit them independently. Failing at `moderate` because anything
      # higher would still allow `moderate` advisories through, and the
      # current baseline is zero. Root devDeps are intentionally not
      # gated here — they're not shipped, and forcing them to zero
      # would block on a vitest/pm2 advisory we can land separately.
      - name: Audit server prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix server

      - name: Audit client prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix client

  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Background on the install dance:
      # vitest 4 → rolldown → @rolldown/binding-linux-x64-gnu. Both
      # `npm install` and `npm ci` hit npm/cli#4828 on the GitHub
      # runner: the linux binding is listed in the lockfile as
      # optional but doesn't land on disk, so vitest crashes at
      # "Cannot find native binding" before any test runs. The
      # binding's own tarball is fine — npm just won't extract it
      # to node_modules under the optional-deps path.
      #
      # Workaround per npm/cli#4828 comments: install the binding
      # explicitly with --no-save after the bulk install. The
      # convenience `install:all` script (npm install everywhere)
      # is still fine for local dev where the lockfile and
      # node_modules co-evolve and the platform bindings line up.
      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: npm ci --prefix server

      - name: Install client deps
        run: npm ci --prefix client

      - name: Force-install rolldown linux binding (npm/cli#4828 workaround)
        run: npm install --no-save --no-audit --no-fund @rolldown/binding-linux-x64-gnu

      - name: Lint
        run: npm run lint

      - name: Unit tests (server)
        run: npm run test:server

      - name: Unit tests + coverage (client)
        run: npm run test:client -- --coverage

  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reinsurance_tool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reinsurance_tool
      NODE_ENV: test
      TEST_WITH_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (root + server)
        run: |
          npm ci
          npm ci --prefix server

      - name: Run DB migrations
        run: npm run migrate --prefix server

      - name: Integration tests
        run: npm run test:server
