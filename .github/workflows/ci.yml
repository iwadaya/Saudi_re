name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'

jobs:
  audit:
    name: prod dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each workspace ships its own lockfile and prod-vs-dev split, so
      # audit them independently. Failing at `moderate` because anything
      # higher would still allow `moderate` advisories through, and the
      # current baseline is zero. Root devDeps are intentionally not
      # gated here — they're not shipped, and forcing them to zero
      # would block on a vitest/pm2 advisory we can land separately.
      - name: Audit server prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix server

      - name: Audit client prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix client

  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` — the setup-node npm cache caches ~/.npm
      # across runs, and a previous cross-platform install can leave
      # corrupted entries for optional native deps (npm/cli#4828)
      # that survive every subsequent `npm ci`, even with --force.
      # Trading 10–15 s of fresh-download time per run for a
      # deterministic install of all rolldown platform bindings.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Root package.json pins the three rolldown platform bindings
      # (darwin-arm64, darwin-x64, linux-x64-gnu) as optionalDependencies
      # so the lockfile lists them regardless of which OS regenerates
      # it. `--include=optional` is explicit (also the default; future-
      # proofing).
      - name: Install root deps
        run: npm ci --include=optional

      - name: Install server deps
        run: npm ci --include=optional --prefix server

      - name: Install client deps
        run: npm ci --include=optional --prefix client

      - name: Lint
        run: npm run lint

      - name: Unit tests (server)
        run: npm run test:server

      - name: Unit tests + coverage (client)
        run: npm run test:client -- --coverage

  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reinsurance_tool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reinsurance_tool
      NODE_ENV: test
      TEST_WITH_DB: '1'
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` — same reason as the lint+unit job: the
      # cross-platform optional-deps cache (npm/cli#4828) is exactly
      # the failure mode this job hit before. Fresh download every run.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install (root + server)
        run: |
          npm ci --include=optional
          npm ci --include=optional --prefix server

      - name: Run DB migrations
        run: npm run migrate --prefix server

      - name: Integration tests
        run: npm run test:server
