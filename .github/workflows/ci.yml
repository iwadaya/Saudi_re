name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'

jobs:
  audit:
    name: prod dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Each workspace ships its own lockfile and prod-vs-dev split, so
      # audit them independently. Failing at `moderate` because anything
      # higher would still allow `moderate` advisories through, and the
      # current baseline is zero. Root devDeps are intentionally not
      # gated here — they're not shipped, and forcing them to zero
      # would block on a vitest/pm2 advisory we can land separately.
      - name: Audit server prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix server

      - name: Audit client prod deps
        run: npm audit --omit=dev --audit-level=moderate --prefix client

  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Root package.json pins the three rolldown platform bindings
      # (darwin-arm64, darwin-x64, linux-x64-gnu) as optionalDependencies
      # so the lockfile lists them regardless of which OS regenerates
      # it. `--include=optional` is explicit (also the default; future-
      # proofing).
      - name: Install root deps
        run: npm ci --include=optional

      - name: Install server deps
        run: npm ci --include=optional --prefix server

      - name: Install client deps
        run: npm ci --include=optional --prefix client

      # Workaround for npm/cli#4828: on the GitHub runner `npm ci`
      # consistently fails to extract the linux-x64 rolldown native
      # binding even with the root pin, --include=optional, --force,
      # and cache disabled (verified across five separate workflow
      # runs). Pull the tarball directly from the npm registry and
      # drop it into place — sidesteps npm's optional-deps machinery
      # entirely. Pinned to 1.0.1 to match the lockfile.
      - name: Plant rolldown linux binding from npm registry
        run: |
          set -euo pipefail
          PKG_DIR=node_modules/@rolldown/binding-linux-x64-gnu
          if [ ! -f "$PKG_DIR/rolldown-binding.linux-x64-gnu.node" ]; then
            mkdir -p "$PKG_DIR"
            curl -sSL https://registry.npmjs.org/@rolldown/binding-linux-x64-gnu/-/binding-linux-x64-gnu-1.0.1.tgz \
              | tar -xz --strip-components=1 -C "$PKG_DIR"
            echo "rolldown linux binding planted:"
            ls -la "$PKG_DIR"
          else
            echo "rolldown linux binding already present — no-op"
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests (server)
        run: npm run test:server

      - name: Unit tests + coverage (client)
        run: npm run test:client -- --coverage

  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reinsurance_tool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reinsurance_tool
      NODE_ENV: test
      TEST_WITH_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install (root + server)
        run: |
          npm ci --include=optional
          npm ci --include=optional --prefix server

      # Same npm/cli#4828 workaround as the lint+unit job — the
      # integration job runs vitest via `npm run test:server`.
      - name: Plant rolldown linux binding from npm registry
        run: |
          set -euo pipefail
          PKG_DIR=node_modules/@rolldown/binding-linux-x64-gnu
          if [ ! -f "$PKG_DIR/rolldown-binding.linux-x64-gnu.node" ]; then
            mkdir -p "$PKG_DIR"
            curl -sSL https://registry.npmjs.org/@rolldown/binding-linux-x64-gnu/-/binding-linux-x64-gnu-1.0.1.tgz \
              | tar -xz --strip-components=1 -C "$PKG_DIR"
          fi

      - name: Run DB migrations
        run: npm run migrate --prefix server

      - name: Integration tests
        run: npm run test:server
