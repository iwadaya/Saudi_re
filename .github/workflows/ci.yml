name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the whole workflow. No job here writes to the repo,
# posts statuses, or uploads SARIF — read-only is all they need. Any future job
# that needs more must opt in with its own `permissions:` block.
permissions:
  contents: read

env:
  NODE_VERSION: '20.18.0'

jobs:
  audit:
    name: prod dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Runtime-only audit gate. `--omit=dev` deliberately scopes this to each
      # workspace's SHIPPED (prod) dependency tree; the baseline is zero
      # moderate-or-higher. `moderate` (not `high`) is intentional so a future
      # runtime *moderate* can't slip through.
      #
      # Deliberately allow-listed because it is NOT in the shipped bundle:
      #   - esbuild GHSA-gv7w-rqvm-qjhr (high) — build-only, reached via the Vite
      #     toolchain which lives in devDependencies; production serves the
      #     pre-built client/dist, so --omit=dev excludes it by design.
      # That advisory (and the prod fixes via `overrides`) is documented in
      # SECURITY.md → "Dependency audit". Root devDeps are likewise not gated
      # (not shipped) — e.g. a vitest/pm2 advisory we can land separately.
      # When a NEW advisory appears, fix it in prod or add it here + SECURITY.md
      # with a reason; do not loosen the gate to make it pass.
      - name: Audit server prod deps (runtime)
        run: npm audit --omit=dev --audit-level=moderate --prefix server

      - name: Audit client prod deps (runtime)
        run: npm audit --omit=dev --audit-level=moderate --prefix client

  license-scan:
    name: dependency license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Install prod deps (server + client)
        run: |
          npm ci --omit=dev --include=optional --prefix server
          npm ci --omit=dev --include=optional --prefix client

      # Fail the build if any SHIPPED dependency carries a strong/network
      # copyleft licence (GPL/AGPL/LGPL/SSPL/EUPL/CDDL) that is incompatible with
      # a proprietary product. `--production` scopes to runtime deps; private
      # workspace packages are excluded. Update SECURITY.md if the list changes.
      - name: Scan server prod dep licences
        run: >
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages
          --start server
          --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-2.0-only;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later;SSPL-1.0;EUPL-1.1;EUPL-1.2;CDDL-1.0;CDDL-1.1"

      - name: Scan client prod dep licences
        run: >
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages
          --start client
          --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-2.0-only;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later;SSPL-1.0;EUPL-1.1;EUPL-1.2;CDDL-1.0;CDDL-1.1"

  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      # Root package.json pins the three rolldown platform bindings
      # (darwin-arm64, darwin-x64, linux-x64-gnu) as optionalDependencies
      # so the lockfile lists them regardless of which OS regenerates
      # it. `--include=optional` is explicit (also the default; future-
      # proofing).
      - name: Install root deps
        run: npm ci --include=optional

      - name: Install server deps
        run: npm ci --include=optional --prefix server

      - name: Install client deps
        run: npm ci --include=optional --prefix client

      # Workaround for npm/cli#4828: on the GitHub runner `npm ci`
      # consistently fails to extract the linux-x64 rolldown native
      # binding even with the root pin, --include=optional, --force,
      # and cache disabled (verified across five separate workflow
      # runs). Pull the tarball directly from the npm registry and
      # drop it into place — sidesteps npm's optional-deps machinery
      # entirely.
      #
      # Version and integrity are READ FROM package-lock.json rather than
      # hard-coded. They were pinned to 1.0.1 while rolldown itself floated
      # (vite/vitest pull it transitively) to 1.1.2, so this step planted a
      # 1.0.1 native binding under a 1.1.2 JS package — which loads, then
      # fails at first use with an opaque "Cannot convert undefined or null
      # to object" out of the binding-error aggregator. Deriving both values
      # from the lockfile keeps them consistent by construction the next time
      # rolldown moves, and keeps the integrity check anchored to a committed
      # file rather than to whatever the registry serves.
      - name: Plant rolldown linux binding from npm registry
        run: |
          set -euo pipefail
          PKG=@rolldown/binding-linux-x64-gnu
          PKG_DIR="node_modules/$PKG"
          # Read the resolved version + integrity for the binding out of the
          # lockfile. The tarball is verified against that recorded sha512
          # BEFORE extraction, so a tampered/MITM'd tarball can never execute
          # as a native .node binding.
          read -r VERSION EXPECTED < <(node -e '
            const lock = require("./package-lock.json");
            const key = "node_modules/@rolldown/binding-linux-x64-gnu";
            const e = lock.packages[key];
            if (!e) { console.error(`${key} missing from package-lock.json`); process.exit(1); }
            console.log(e.version, e.integrity);
          ')
          echo "lockfile pins $PKG@$VERSION"
          # Guard against the drift this step used to paper over: the binding
          # must match the rolldown package that will load it.
          ROLLDOWN_VERSION="$(node -e 'console.log(require("./package-lock.json").packages["node_modules/rolldown"].version)')"
          if [ "$VERSION" != "$ROLLDOWN_VERSION" ]; then
            echo "rolldown version mismatch: rolldown@$ROLLDOWN_VERSION vs binding@$VERSION." >&2
            echo "Align the root optionalDependencies pin in package.json with rolldown's version." >&2
            exit 1
          fi
          # Plant unconditionally rather than skipping when a .node is already
          # present. npm/cli#4828 makes the extraction non-deterministic: in the
          # same workflow run the lint job got no binding (so the old code
          # planted one and passed) while the integration job got a partial
          # extraction — enough for the "already present" check to skip, not
          # enough for rolldown to load — and died on the same startup error.
          # Overwriting costs about a second and removes the nondeterminism.
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          curl -sSL "https://registry.npmjs.org/$PKG/-/binding-linux-x64-gnu-$VERSION.tgz" -o /tmp/rolldown.tgz
          ACTUAL="sha512-$(openssl dgst -sha512 -binary /tmp/rolldown.tgz | openssl base64 -A)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "rolldown tarball integrity mismatch! expected=$EXPECTED actual=$ACTUAL" >&2
            exit 1
          fi
          tar -xz --strip-components=1 -C "$PKG_DIR" -f /tmp/rolldown.tgz
          echo "rolldown linux binding $VERSION planted (integrity verified):"
          ls -la "$PKG_DIR"
          # Prove the binding actually loads before handing off to vitest, so a
          # bad plant fails here with a clear message instead of surfacing later
          # as an opaque vite config-load error.
          node -e "require('$PKG_DIR/rolldown-binding.linux-x64-gnu.node'); console.log('rolldown binding loads OK')"

      # ── Enterprise gate (mirrors `npm run verify`, package.json) ──
      # Every step below is a hard gate: a non-zero exit fails the job, and the
      # `integration` job needs this one, so nothing merges on a red gate.
      - name: Lint
        run: npm run lint

      # Frontend typecheck (client tsc --noEmit) — part of `verify`, was missing in CI.
      - name: Frontend typecheck
        run: npm run typecheck

      # Frontend ratchet budget (inline styles / LOC / a11y / console) — scans
      # client/src/screens source, no build needed.
      - name: Frontend budget
        run: npm run budget:frontend

      - name: Unit tests (server)
        run: npm run test:server

      # Build the client BEFORE the client tests so bundleBudget.test.js runs
      # against a real dist/ (it FAILS rather than skips when dist is absent).
      # This is also the production build gate from `verify`.
      - name: Build client (production build + bundle-size budget)
        run: npm run build --prefix client

      - name: Unit tests + coverage (client)
        run: npm run test:client -- --coverage

  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reinsurance_tool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reinsurance_tool
      NODE_ENV: test
      TEST_WITH_DB: '1'
      # env.js freezes provider keys at import time, before integration
      # tests can mutate process.env. Provide stubs at the process
      # level so the renewal-pack import test's mocked fetch
      # interceptor takes over — they're never used to call out.
      GEMINI_API_KEY: ci-stub-gemini-key
      OPENAI_API_KEY: ci-stub-openai-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (root + server)
        run: |
          npm ci --include=optional
          npm ci --include=optional --prefix server

      # Same npm/cli#4828 workaround as the lint+unit job — the
      # integration job runs vitest via `npm run test:server`.
      - name: Plant rolldown linux binding from npm registry
        run: |
          set -euo pipefail
          PKG_DIR=node_modules/@rolldown/binding-linux-x64-gnu
          # Verify the tarball against the lockfile's sha512 before extracting.
          EXPECTED="sha512-XABVmGp9Tg0WspTVvwduTc4fpqy6JnAUrSQe6OuyqD/03nI7r0O9OWUkMIwFrjKAIqolvqoA4ZrJppgwE0Gxmw=="
          if [ ! -f "$PKG_DIR/rolldown-binding.linux-x64-gnu.node" ]; then
            mkdir -p "$PKG_DIR"
            curl -sSL https://registry.npmjs.org/@rolldown/binding-linux-x64-gnu/-/binding-linux-x64-gnu-1.0.1.tgz -o /tmp/rolldown.tgz
            ACTUAL="sha512-$(openssl dgst -sha512 -binary /tmp/rolldown.tgz | openssl base64 -A)"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "rolldown tarball integrity mismatch! expected=$EXPECTED actual=$ACTUAL" >&2
              exit 1
            fi
            tar -xz --strip-components=1 -C "$PKG_DIR" -f /tmp/rolldown.tgz
          fi

      - name: Run DB migrations
        run: npm run migrate --prefix server

      # Postgres-backed integration suite. Includes the PRODUCTION-AUTH path
      # (tests/integration/productionAuth.integration.test.js): it unsets
      # ALLOW_DEMO_AUTH, logs in for a real httpOnly auth cookie + CSRF token,
      # and proves a cookie-authenticated mutation needs the X-CSRF-Token header
      # (403 CSRF_FAILED without it). A non-zero exit fails the job.
      #
      # Runs WITH coverage so the server thresholds (server/vitest.config.js —
      # global + auth/workflow/pricing/documents) are enforced here, where the DB
      # is available and the integration suite actually exercises those paths.
      - name: Integration tests + coverage thresholds (postgres + production-auth path)
        run: npm run test:server:coverage
