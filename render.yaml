services:
  - type: web
    name: modelling-tool
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm run build --prefix client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "false"
      - key: CORS_ORIGIN
        value: "https://modelling-tool.onrender.com"
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
