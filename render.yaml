services:
  - type: web
    name: modelling-tool
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm run build --prefix client
    # Migrations run as an explicit pre-deploy step. A failing migration
    # fails the deploy cleanly instead of taking the previous version
    # down on boot. RUN_MIGRATIONS_ON_BOOT stays at its default (false)
    # so the server only ever starts against a known-good schema.
    preDeployCommand: npm run migrate:up --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pricing integrity: reject (422) saves whose total_price drifts from the
      # canonical shared formula, rather than warn-only. Production also defaults
      # to strict in code (see lib/pricingVerifier.isStrictMode); this pins it
      # explicitly. Set to "0" only as a rehearsed emergency rollback.
      - key: PRICING_STRICT
        value: "1"
      - key: CORS_ORIGIN
        value: "https://modelling-tool.onrender.com"
      - key: SESSION_TTL_HOURS
        value: "8"
      # Production security posture (see SECURITY.md):
      #   • ALLOW_DEMO_AUTH is intentionally UNSET → the universal 'demo2026'
      #     password and x-user-* header identity are rejected; only verified
      #     token auth against real scrypt passwords works.
      #   • Open (login-screen) self-registration is OFF → only CU/CE create users.
      # A dev/preview service may set ALLOW_OPEN_REGISTRATION=true (and
      # ALLOW_DEMO_AUTH=true) for testing; production must not.
      - key: ALLOW_OPEN_REGISTRATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      # REQUIRED in production (validateEnv refuses to boot without it): the
      # secret that signs/verifies auth tokens (lib/authToken.js). >=32 chars,
      # set in the Render dashboard, never committed.
      - key: AUTH_JWT_SECRET
        sync: false
      # Session/cookie secret (>=32 chars). Required secret for the prod service.
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
