# /etc/nginx/sites-available/universe — TLS terminator + reverse proxy.
#
#   sudo install -m 644 deploy/nginx/universe.conf /etc/nginx/sites-available/universe
#   sudo sed -i 's/universe.example.internal/YOUR.HOST.NAME/' /etc/nginx/sites-available/universe
#   sudo ln -sf /etc/nginx/sites-available/universe /etc/nginx/sites-enabled/universe
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is MANDATORY: the app marks its auth cookies Secure in production, so a
# browser will not send them over plain http:// and every login appears to
# fail. The certificate below is the Ubuntu placeholder (ssl-cert package) so
# nginx starts before you have a real one — replace it with your corporate CA
# certificate or Let's Encrypt (see deploy/README.md → Step 7).

upstream universe_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Plain HTTP: only the ACME challenge, everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name universe.example.internal;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name universe.example.internal;

    # Replace with the real certificate + key.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:universe_ssl:10m;
    ssl_session_timeout 1d;

    # Largest upload the API accepts (multer fileSize limit is 50 MB).
    client_max_body_size 50m;

    # Slightly above the app's own 35 s request timeout so its 503 wins.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/universe.access.log;
    error_log  /var/log/nginx/universe.error.log;

    location / {
        proxy_pass http://universe_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
